# Kamal 2.12+. Export deployment settings in your shell; secrets are read separately.
service: fluently
image: <%= ENV.fetch("FLUENTLY_IMAGE").to_json %>
minimum_version: 2.12.0

servers:
  web:
    hosts:
      - <%= ENV.fetch("FLUENTLY_SERVER").to_json %>
    cmd: /app/bin/deploy-server

proxy:
  ssl: true
  host: <%= ENV.fetch("PHX_HOST").to_json %>
  app_port: 4000
  forward_headers: true
  healthcheck:
    path: /up
    interval: 2
    timeout: 3
  buffering:
    max_request_body: 307200

registry:
  server: <%= ENV.fetch("KAMAL_REGISTRY_SERVER", "ghcr.io").to_json %>
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME").to_json %>
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: <%= ENV.fetch("FLUENTLY_ARCH", "amd64").to_json %>

ssh:
  user: <%= ENV.fetch("FLUENTLY_SSH_USER", "root").to_json %>

volumes:
  - fluently_data:/data

env:
  clear:
    DATABASE_PATH: /data/fluently.db
    PHX_HOST: <%= ENV.fetch("PHX_HOST").to_json %>
    PORT: "4000"
    POOL_SIZE: "5"
<% if ENV["SENTRY_DSN"] %>
    SENTRY_DSN: <%= ENV.fetch("SENTRY_DSN").to_json %>
<% end %>
    MAIL_FROM: <%= ENV.fetch("MAIL_FROM", "hello@fluently.now").to_json %>
<% if ENV["FLUENTLY_PROJECT_ID"] && !ENV["FLUENTLY_PROJECT_ID"].empty? %>
    FLUENTLY_PROJECT_ID: <%= ENV.fetch("FLUENTLY_PROJECT_ID").to_json %>
<% end %>
  secret:
    - SECRET_KEY_BASE
    - RESEND_API_KEY

deploy_timeout: 90

accessories:
  litestream:
    image: litestream/litestream:0.5.14
    host: <%= ENV.fetch("FLUENTLY_SERVER").to_json %>
    # Match the Phoenix image's nobody UID/GID so either process can manage WAL files.
    options:
      user: "65534:65534"
      stop-timeout: 60
    volumes:
      - fluently_data:/data
    files:
      - config/litestream.yml:/etc/litestream.yml
    env:
      clear:
        LITESTREAM_BUCKET: <%= ENV.fetch("LITESTREAM_BUCKET", "fluently-backups").to_json %>
      secret:
        - LITESTREAM_ACCESS_KEY_ID
        - LITESTREAM_SECRET_ACCESS_KEY
    cmd: replicate -config /etc/litestream.yml
